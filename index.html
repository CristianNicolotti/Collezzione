<!doctype html>
<html lang="it"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Collezione">
<link rel="apple-touch-icon" href="icon.png">
<title>Collezione Pokémon</title>
<style>
:root{--bg:#070a14;--c1:#0f1422;--c2:#182036;--tx:#f2f4fb;--mu:#8b93ad;--ac:#9b5cf6;--ok:#34d399;--ko:#f87171}
:root[data-t=light]{--bg:#f3f4f9;--c1:#fff;--c2:#e9ecf5;--tx:#12172a;--mu:#656d88}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent;touch-action:manipulation}html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,system-ui,sans-serif;padding:calc(env(safe-area-inset-top) + 68px) 14px calc(env(safe-area-inset-bottom) + 90px)}
header{position:fixed;top:0;left:0;right:0;padding:calc(env(safe-area-inset-top) + 8px) 14px 8px;background:var(--bg);z-index:5}
input,select,button{font:inherit;color:var(--tx)}
input,select{width:100%;background:var(--c2);border:0;border-radius:12px;padding:11px 14px;outline:0}
button{border:0;background:var(--c2);border-radius:12px;padding:11px 14px;cursor:pointer}
.pri{background:var(--ac);color:#fff;font-weight:600;width:100%}
h1{font-size:26px;margin:6px 0 12px}h2{font-size:18px;margin:14px 0 8px}
.card{background:var(--c1);border-radius:18px;padding:14px;margin-bottom:10px}
.row{display:flex;align-items:center;gap:10px;justify-content:space-between}
.mu{color:var(--mu);font-size:14px}.big{font-size:34px;font-weight:700}
.up{color:var(--ok)}.dn{color:var(--ko)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.grid>div{background:var(--c1);border-radius:12px;padding:6px;font-size:13px;position:relative}
.grid img{width:100%;border-radius:6px;display:block}
.grid .own{outline:2px solid var(--ac)}
.bd{position:absolute;top:8px;right:8px;background:var(--ac);color:#fff;border-radius:10px;padding:0 7px;font-size:12px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--c1);padding:8px 6px calc(env(safe-area-inset-bottom) + 8px);z-index:5}
nav button{flex:1;background:none;font-size:12px;color:var(--mu);padding:8px 2px}
nav button.on{color:var(--ac);font-weight:700}
#sh{position:fixed;inset:0;background:#000a;z-index:9;display:none;align-items:flex-end}
#sh>div{background:var(--bg);width:100%;max-height:88vh;overflow:auto;border-radius:22px 22px 0 0;padding:16px 16px calc(env(safe-area-inset-bottom) + 20px)}
label{display:block;margin:10px 0 4px}#fs{position:fixed;inset:0;background:#000d;z-index:20;display:none;align-items:center;justify-content:center}.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}.tile{background:var(--c1);border-radius:18px;padding:12px}.lg{height:110px;display:flex;align-items:center;justify-content:center;margin-bottom:6px}.bar{height:6px;background:var(--c2);border-radius:4px;overflow:hidden;margin:8px 0 4px}.bar i{display:block;height:100%;background:var(--ac)}summary{list-style:none;cursor:pointer}summary::-webkit-details-marker{display:none}#sh .pri{margin-top:18px}.ph{display:flex;align-items:center;justify-content:center;text-align:center;background:linear-gradient(135deg,var(--c2),var(--c1));border:1px solid var(--c2);border-radius:12px;font-weight:700;font-size:13px;color:var(--mu);padding:4px;overflow:hidden;box-sizing:border-box}

@media(min-width:700px){
body{padding-left:24px;padding-right:24px}
header{padding-left:24px;padding-right:24px}
header input{max-width:1100px;display:block;margin:0 auto}
main{max-width:1100px;margin:0 auto}
.grid{grid-template-columns:repeat(4,1fr);gap:12px}
.g2{grid-template-columns:repeat(3,1fr)}
#sh{align-items:center;justify-content:center}
#sh>div{max-width:760px;border-radius:22px;max-height:90vh;padding:22px}
#m:has(#cv){max-width:440px}
}
@media(min-width:1024px){
body{padding-left:230px}
header{left:206px}
nav{top:0;bottom:0;right:auto;width:206px;flex-direction:column;justify-content:flex-start;gap:6px;padding:76px 12px 12px;border-right:1px solid var(--c2)}
nav button{text-align:left;font-size:15px;padding:12px 14px;flex:none}
nav button.on{background:var(--c2)}
.grid{grid-template-columns:repeat(5,1fr)}
.grid>div{font-size:14px}
.g2{grid-template-columns:repeat(4,1fr)}
#sh>div{max-width:900px}
#sh>div:has(>.row img[data-a=zoom]){display:grid;grid-template-columns:260px 1fr;gap:0 28px;align-items:start}
#sh>div:has(>.row img[data-a=zoom])>*{grid-column:2}
#sh>div:has(>.row img[data-a=zoom])>div:first-child{grid-column:1/-1}
#sh>div:has(>.row img[data-a=zoom])>.row{grid-column:1;grid-row:2/span 30;flex-direction:column;align-items:flex-start}
#sh>div:has(>.row img[data-a=zoom])>.row img{width:100%}
}
</style></head><body>
<header><input id="q" placeholder="Cerca una carta (es. Mantine o Mantine 77)" enterkeyhint="search"></header>
<main id="m"></main>
<nav id="nv"></nav><div id="sh"></div><div id="fs" data-a="fsx"></div><input type="file" id="fi" accept=".csv" hidden><input type="file" id="ph" accept="image/*" capture="environment" hidden>
<script>
const L=localStorage;let S={};try{S=JSON.parse(L.ptk1)||{}}catch(e){}
Object.assign(S,{name:S.name||'',theme:S.theme||'dark',key:S.key||'',cols:S.cols||[{id:'c1',n:'La mia collezione'}],cur:S.cur||'c1',items:S.items||[],wish:S.wish||[],hist:S.hist||[]});
const save=()=>{try{L.ptk1=JSON.stringify(S)}catch(e){}};
const E=s=>String(s??'').replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');
const eur=n=>'€'+(n||0).toLocaleString('it-IT',{minimumFractionDigits:2,maximumFractionDigits:2});
const $=s=>document.querySelector(s);
const COND=[['MT','Mint'],['NM','Near Mint'],['EX','Excellent'],['GD','Good'],['LP','Light Played'],['PL','Played'],['PO','Poor']];
const LANG=['IT','EN','JA','DE','FR','ES','PT','KO','ZH'];
const VL={normal:'Normale',holofoil:'Holo',reverseHolofoil:'Reverse Holo','1stEditionHolofoil':'1ª ed. Holo','1stEditionNormal':'1ª ed.',unlimitedHolofoil:'Unlimited Holo',unlimited:'Unlimited'};
const opt=(a,v)=>a.map(x=>{const[k,t]=Array.isArray(x)?x:[x,x];return`<option value="${E(k)}"${k==v?' selected':''}>${E(t)}</option>`}).join('');
let tab='home',sub=null,R=[],SETS=null,msg='',LQ='';
const cget=k=>{try{const v=JSON.parse(L.ptkc||'{}')[k];return v&&Date.now()-v.t<864e5?v.d:null}catch(e){return null}};
const cput=(k,d)=>{try{const o=JSON.parse(L.ptkc||'{}'),ks=Object.keys(o);if(ks.length>12)delete o[ks[0]];o[k]={t:Date.now(),d};L.ptkc=JSON.stringify(o)}catch(e){}};
const sortR=(a,o)=>a.sort((x,y)=>o=='new'?(y.d||'').localeCompare(x.d||''):o=='old'?(x.d||'').localeCompare(y.d||''):o=='n'?x.n.localeCompare(y.n):o=='p'?y.p-x.p:o=='pl'?x.p-y.p:(parseInt(x.num)||0)-(parseInt(y.num)||0));
const bar=()=>`<div class="row">${back}<select data-ch="sort" style="width:auto">${opt([['new','Più recenti'],['old','Meno recenti'],['n','Nome'],['p','Prezzo ↓'],['pl','Prezzo ↑'],['num','Numero']],sub.o)}</select></div>`;
const rt=()=>sub.err?'<br><button class="pri" data-a="retry">Riprova</button><br>':'';
document.documentElement.dataset.t=S.theme;
async function api(p){let er;for(let t=0;t<3;t++){try{const c=new AbortController(),to=setTimeout(()=>c.abort(),15000);const r=await fetch('https://api.pokemontcg.io/v2/'+p,{headers:S.key?{'X-Api-Key':S.key}:{},signal:c.signal});clearTimeout(to);if(!r.ok)throw new Error('Errore '+r.status);return(await r.json()).data}catch(e){er=e;await new Promise(r=>setTimeout(r,700*(t+1)))}}throw er}
const pr=c=>{const m=c.cardmarket&&c.cardmarket.prices;return m?(m.trendPrice??m.averageSellPrice??m.avg30??0):0};
const cmx=c=>{const m=c.cardmarket&&c.cardmarket.prices;return m?{a1:m.avg1,a7:m.avg7,a30:m.avg30,t:m.trendPrice}:null};
const mk=c=>({id:c.id,n:c.name,s:c.set.name,sid:c.set.id,ser:c.set.series,d:c.set.releaseDate,num:c.number+'/'+c.set.printedTotal,img:c.images.small,p:pr(c),cm:cmx(c),vs:Object.keys((c.tcgplayer&&c.tcgplayer.prices)||{})});
const SEL='select=id,name,number,set,images,tcgplayer,cardmarket';
const colItems=()=>S.items.filter(i=>i.col==S.cur);
const val=a=>a.reduce((t,i)=>t+i.q*i.p,0);
const owned=id=>colItems().some(i=>i.id==id);
async function doSearch(t){t=t.replace(/["*]/g,'').trim();if(!t)return;LQ=t;sub={t:'res',o:'new'};msg='Cerco…';R=[];render();
 const m=t.match(/^(.*?)\s+(\d+)$/);const q=m?`name:"${m[1]}*" number:${m[2]}`:`name:"${t}*"`;
 const k='s:'+q,c=cget(k);if(c){R=c;msg=''}else try{R=(await api('cards?pageSize=100&'+SEL+'&q='+encodeURIComponent(q))).map(mk);if(R.length)cput(k,R);msg=R.length?'':'Nessuna carta trovata'}catch(e){R=[];msg='Ricerca non riuscita ('+e.message+').';sub.err=1}sortR(R,sub.o);render()}
$('#q').addEventListener('keydown',e=>{if(e.key=='Enter'){e.target.blur();doSearch(e.target.value)}});
function grid(list,fn){return`<div class="grid">${list.map((c,i)=>`<div data-a="${fn}" data-i="${i}" class="${owned(c.id)?'own':''}"><img loading="lazy" src="${E(c.img)}" alt=""><b>${E(c.n)}</b><div class="mu">${E(c.num)} · ${eur(c.p)}</div>${owned(c.id)?'<span class="bd">✓</span>':''}</div>`).join('')}</div>`}
function chart(){const h=S.hist.map(x=>x[1][S.cur]).filter(v=>v!=null).slice(-30);if(h.length<2)return'<p class="mu">Il grafico si riempie giorno dopo giorno, aprendo l’app.</p>';
 const mx=Math.max(...h),mn=Math.min(...h),r=(mx-mn)||1;const p=h.map((v,i)=>`${i*(300/(h.length-1))},${60-((v-mn)/r)*54}`).join(' ');
 return`<svg viewBox="0 0 300 64" width="100%" height="80"><polyline points="${p}" fill="none" stroke="var(--ac)" stroke-width="2.5"/></svg>`}
function colSel(){return`<div class="row"><select data-ch="cur">${opt(S.cols.map(c=>[c.id,c.n]),S.cur)}</select><button data-a="newcol">+</button></div>`}
const back='<button data-a="back">← Indietro</button>';
const home=()=>{const v=val(colItems()),top=[...colItems()].sort((a,b)=>b.p-a.p).slice(0,6);return`<h1>Ciao${S.name?', '+E(S.name):''}!</h1><div class="card"><div class="mu">Valore collezione</div>${colSel()}<div class="big">${eur(v)}</div>${chart()}</div>`+(top.length?`<h2>Le tue carte migliori</h2><div class="grid">${top.map(i=>`<div data-a="edit" data-i="${S.items.indexOf(i)}"><img loading="lazy" src="${E(i.img)}" alt=""><b>${E(i.n)}</b><div style="font-size:17px;font-weight:700">${pe(i.p)}</div></div>`).join('')}</div>`:'')};
const scan=()=>`<h1>Scanner</h1><p class="mu" id="cm">Appoggia la carta dentro la cornice, con buona luce e senza riflessi, poi tocca Scatta.</p><div style="position:relative;border-radius:18px;overflow:hidden;background:#000;margin:10px 0"><video id="cv" playsinline muted autoplay style="width:100%;display:block;aspect-ratio:3/4;object-fit:cover"></video><div style="position:absolute;inset:6% 8%;border:3px solid var(--ac);border-radius:14px"></div></div><button class="pri" data-a="snap">Scatta</button><br><br><div class="row"><button data-a="photo" style="flex:1">Foto (riserva)</button><button data-a="manual" style="flex:1">Cerca a mano</button></div>`;
async function loadSets(){if(SETS||SL||Date.now()-SF<20000)return;SL=1;try{SETS=await api('sets?orderBy=-releaseDate&select=id,name,series,total,printedTotal,releaseDate')}catch(e){SF=Date.now();msg='Impossibile caricare le espansioni ('+e.message+')'}SL=0;mapSets();if(SETS){S.items.forEach(i=>{if(!i.d){const x=SETS.find(z=>z.id==i.sid);if(x)i.d=x.releaseDate}});save()}render()}
const exp=()=>{const tabs='';
 loadSets();loadDex(EL);const D=DEX[EL];
 if(!D)return'<h1>Espansioni</h1>'+tabs+'<p class="mu">Carico le espansioni…</p>'+(msg?`<p class="dn">${E(msg)}</p>`:'');
 const ow={};colItems().forEach(i=>(ow[i.sid]=ow[i.sid]||new Set()).add(i.id));
 return'<h1>Espansioni</h1>'+tabs+[...D].reverse().map(sr=>{const ss=[...sr.sets].reverse();return`<details data-sr="${E(sr.id)}"${OS==sr.id?' open':''}><summary><div class="card row"><div style="display:flex;gap:12px;align-items:center">${(()=>{const x=sr.logo?{logo:sr.logo}:ss.find(y=>y.logo||y.wl);return dl(x?(x.logo||x.wl):'','84px','36px',ini(sr.n))})()}<b style="font-size:18px">${E(sr.n)}</b></div><span class="mu">${ss.length} ›</span></div></summary><div class="g2">${ss.map(s=>{const o=ow[s.pt||s.id]?ow[s.pt||s.id].size:0;return`<div class="tile" data-a="dset" data-l="${EL}" data-id="${E(s.id)}" data-pt="${E(s.pt||'')}"><div class="lg">${dl(s.logo||s.wl,'100%','110px',s.n)}</div><b>${E(s.n)}</b><div class="bar"><i style="width:${Math.min(100,o/(s.tot||1)*100)}%"></i></div><div class="mu">${EL=='it'?o+'/'+s.tot:s.tot+' carte'}</div></div>`}).join('')}</div></details>`}).join('')};
const col=()=>{loadSets();loadDex('it');const a=colItems(),g={};a.forEach(i=>(g[i.sid]=g[i.sid]||{n:i.s,l:[]}).l.push(i));
 return`<h1>Collezioni</h1>${colSel()}<div class="card"><div class="mu">Valore</div><div class="big">${eur(val(a))}</div>${chart()}</div><h2>Per espansione</h2>`+(a.length?Object.keys(g).sort((x,y)=>dt(y,g).localeCompare(dt(x,g))).map(k=>`<div class="card row" data-a="cs" data-id="${E(k)}"><div style="display:flex;gap:12px;align-items:center">${lgo(k,'72px','40px')}<div><b>${E(sn(k,g[k].n))}</b><div class="mu">${g[k].l.reduce((t,i)=>t+i.q,0)} carte · ${[...new Set(g[k].l.map(i=>i.lg))].map(x=>FL[x]||x).join(' ')}</div></div></div><b>${eur(val(g[k].l))} ›</b></div>`).join(''):'<p class="mu">Ancora nessuna carta. Cercane una e aggiungila.</p>')};
const menu=()=>`<h1>Menu</h1><div class="card"><button class="pri" data-a="settings">Impostazioni</button></div><div class="card"><button class="pri" data-a="wl">Wishlist (${S.wish.length})</button></div><div class="card"><button class="pri" data-a="imp">Importa CSV</button></div><div class="card"><button class="pri" data-a="exp">Esporta CSV</button></div>`;
function subView(){
 if(sub.t=='res')return bar()+`<h2>Risultati</h2>`+(msg?`<p class="mu">${E(msg)}</p>`:'')+rt()+grid(R,'add');
 if(sub.t=='set')return setView();
 if(sub.t=='cand')return back+`<h2>Quale carta è?</h2><p class="mu">Tocca quella uguale alla tua. Espansione e prezzo sono già compilati.</p>`+grid(R,'add')+`<br><button data-a="manual" style="width:100%">Nessuna è giusta: cerca a mano</button>`;
 if(sub.t=='wl'){return back+'<h2>Wishlist</h2>'+(S.wish.length?`<div class="grid">${S.wish.map((c,i)=>`<div data-a="wadd" data-i="${i}"><img src="${E(c.img)}" alt=""><b>${E(c.n)}</b><div class="mu">${eur(c.p)}</div></div>`).join('')}</div><p class="mu">Tocca una carta per aggiungerla alla collezione.</p>`:'<p class="mu">Nessuna carta in wishlist. Aggiungila dalla scheda di una carta.</p>')}
 if(sub.t=='cs')return csView()}
function render(){$('#m').innerHTML=sub?subView():({home,exp,scan,col,menu}[tab])();
 if(tab=='scan'&&!sub)startCam();else stopCam();
 $('#nv').innerHTML=[['home','Home'],['exp','Espansioni'],['scan','Scanner'],['col','Collezioni'],['menu','Menu']].map(([k,t])=>`<button data-a="tab" data-id="${k}" class="${tab==k?'on':''}">${t}</button>`).join('')}
const sheet=h=>{$('#sh').innerHTML=`<div>${h}</div>`;$('#sh').style.display='flex'};
const close=()=>{$('#sh').style.display='none'};
function form(c,it){const vs=c.vs&&c.vs.length?c.vs:['normal'];
 return`<div style="margin-bottom:12px"><button data-a="close">← Indietro</button></div><div class="row" style="align-items:flex-start"><img src="${E(c.img)}" width="110" style="border-radius:8px" data-a="zoom" data-src="${E(c.img)}"><div style="flex:1"><h2 style="margin-top:0">${E(c.n)}</h2><div class="mu">${E(c.s)} · ${E(c.num)}</div><div class="big" style="font-size:26px">${eur(c.p)}</div><div class="mu">Tocca la carta per ingrandirla</div></div></div>
 <label>Collezione</label><select id="f-col">${opt(S.cols.map(x=>[x.id,x.n]),it?it.col:S.cur)}</select>
 <label>Lingua</label><select id="f-lg">${opt(LANG,it?it.lg:'IT')}</select>
 <label>Condizione</label><select id="f-cd">${opt(COND.map(x=>[x[0],x[0]+' – '+x[1]]),it?it.cd:(S.lc||'NM'))}</select>
 <label>Variante</label><select id="f-vr">${opt(vs.map(v=>[v,VL[v]||v]),it?it.vr:vs[0])}</select>
 <label>Quantità</label><input id="f-q" type="number" min="1" value="${it?it.q:1}" inputmode="numeric">
 <label>Prezzo d’acquisto (€, facoltativo)</label><input id="f-b" type="number" step="0.01" value="${it&&it.b!=null?it.b:''}" inputmode="decimal"><br>`}
const rd=()=>({col:$('#f-col').value,lg:$('#f-lg').value,cd:$('#f-cd').value,vr:$('#f-vr').value,q:Math.max(1,parseInt($('#f-q').value)||1),b:$('#f-b').value===''?null:parseFloat($('#f-b').value)});
let cur=null;
const A={
 tab(d){tab=d.id;sub=null;msg='';$('#q').value='';render()},back(){sub=null;msg='';$('#q').value='';render();if(tab=='exp'||tab=='col')window.scrollTo(0,SY)},close,
 retry(){sub&&sub.t=='set'?(sub.td?A.tset({id:sub.tid}):A.set({id:sub.id})):doSearch(LQ)},
 add(d){cur=R[d.i];sheet(form(cur)+`<button class="pri" data-a="doadd">Aggiungi alla collezione</button><br><br><button data-a="dowish" style="width:100%">♥ Aggiungi alla wishlist</button><br><br><button data-a="close" style="width:100%">Annulla</button><h2>Andamento prezzo</h2>`+pchart(cur.cm,cur.p))},
 doadd(){const f=rd(),c=cur;const k=S.items.find(i=>i.id==c.id&&i.col==f.col&&i.lg==f.lg&&i.cd==f.cd&&i.vr==f.vr);
  if(k){k.q+=f.q;if(f.b!=null)k.b=f.b}else S.items.push({id:c.id,n:c.n,s:c.s,sid:c.sid,ser:c.ser,num:c.num,img:c.img,p:c.p,p0:c.p,d:c.d,cm:c.cm,...f});
  S.lc=f.cd;if(sub&&sub.t=='cand'){sub=null;tab='scan'}save();close();render()},
 dowish(){if(!S.wish.some(w=>w.id==cur.id))S.wish.push(cur);save();close()},
 wadd(d){R=S.wish;A.add(d)},
 edit(d){const i=S.items[d.i];cur=i;cur.idx=+d.i;const m=i.cm;
  sheet(form(i,i)+`<button class="pri" data-a="doedit">Salva modifiche</button><br><br><button data-a="dodel" style="width:100%;color:var(--ko)">Elimina carta</button><h2>Andamento prezzo</h2>`+pchart(m,i.p))},
 doedit(){Object.assign(S.items[cur.idx],rd());save();close();render()},
 dodel(){if(confirm('Eliminare questa carta dalla collezione?')){S.items.splice(cur.idx,1);save();close();render()}},
 async set(d){sub={t:'set',id:d.id,o:'num',f:'all',q:'',n:(LG[d.id]&&LG[d.id].n)||(SETS.find(s=>s.id==d.id)||{}).name};msg='Carico le carte…';R=[];render();
  try{let r=await api(`cards?pageSize=250&${SEL}&q=`+encodeURIComponent('set.id:'+d.id));if(r.length>=250)r=r.concat(await api(`cards?pageSize=250&page=2&${SEL}&q=`+encodeURIComponent('set.id:'+d.id)));R=r.map(mk);sortR(R,'num');msg='';const td=(DEX.it||[]).flatMap(s=>s.sets).find(y=>y.pt==d.id);if(td&&(!R.length||R.every(c=>!c.p))){await A.tset({id:td.id});return}}catch(e){msg='Caricamento non riuscito ('+e.message+')';sub.err=1}render()},
